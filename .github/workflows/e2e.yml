name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        working-directory: tests-e2e
        run: npm install
      - name: Instalar o navegador
        working-directory: tests-e2e
        run: npx playwright install --with-deps chromium
      - name: Rodar os testes de navegador
        working-directory: tests-e2e
        run: npx playwright test
      - name: Guardar o relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: tests-e2e/relatorio
          retention-days: 14
